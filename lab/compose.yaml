name: blind-sqli-mysql-lab
services:
  db:
    image: ${LAB_IMAGE:-kazal92/blind-sqli-lab}:mysql84-db
    build:
      context: ..
      dockerfile: lab/Dockerfile.db
    environment:
      MYSQL_ROOT_PASSWORD: lab_bootstrap_only
      MYSQL_DATABASE: lab
      MYSQL_USER: lab_user
      MYSQL_PASSWORD: lab_only_password
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=30"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D lab -Nse 'SELECT COUNT(*) FROM users'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  web:
    image: ${LAB_IMAGE:-kazal92/blind-sqli-lab}:mysql84
    build:
      context: ..
      dockerfile: lab/Dockerfile.web
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: lab
      MYSQL_USER: lab_user
      MYSQL_PASSWORD: lab_only_password
    ports:
      - "127.0.0.1:5080:5080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  cli:
    profiles: ["tools"]
    image: ${LAB_IMAGE:-kazal92/blind-sqli-lab}:mysql84
    network_mode: service:web
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /app
    entrypoint: ["python", "sqli.py"]
    volumes:
      - ../requests:/requests:ro
      - ./results:/results
    depends_on:
      web:
        condition: service_healthy
volumes:
  mysql-data:
